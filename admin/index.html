<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RA Messages</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="/admin/manifest.webmanifest">
<meta name="theme-color" content="#262628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="RA Messages">
<link rel="apple-touch-icon" href="/admin/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/admin/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Colours taken from the ROOT Ahead logo itself */
  :root{
    --char:#262628; --char-2:#2f2f32; --char-3:#3a3a3e;
    --yellow:#fbc120; --yellow-ink:#2a2006;
    --grey:#e5e4e3; --muted:#a3a19c; --bad:#ff8a73; --good:#9fd59a;
    --r:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--char);color:var(--grey);font:400 16px/1.5 'IBM Plex Sans',system-ui,sans-serif;
    -webkit-text-size-adjust:100%;}
  body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);min-height:100vh;}
  button,input,textarea,select{font:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--yellow);outline-offset:2px;}
  .wrap{max-width:560px;margin:0 auto;padding:18px 18px 40px;}
  h1,h2{font-family:'Archivo',system-ui,sans-serif;margin:0;}
  .muted{color:var(--muted);}

  /* lock screen */
  #lock{min-height:100vh;display:grid;place-items:center;padding:24px;}
  .lock-card{width:min(380px,100%);text-align:left;}
  .lock-card img{width:190px;display:block;margin:0 0 18px;}
  .lock-card h1{font-size:26px;font-weight:800;margin-bottom:4px;}
  .lock-card p{margin:0 0 18px;}
  .field{display:block;margin:14px 0 6px;font-size:14px;font-weight:600;}
  input[type=password],input[type=text],input[type=search],textarea,select{
    width:100%;background:var(--char-2);border:1px solid var(--char-3);border-radius:10px;padding:12px 13px;font-size:16px;}
  textarea{resize:vertical;min-height:96px;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--yellow);}
  .go{width:100%;margin-top:14px;background:var(--yellow);color:var(--yellow-ink);border:none;border-radius:12px;
    padding:14px 18px;font-family:'Archivo',sans-serif;font-weight:800;font-size:17px;cursor:pointer;}
  .go:disabled{opacity:.45;cursor:not-allowed;}
  .err{color:var(--bad);min-height:22px;margin-top:10px;font-size:14px;}

  /* app */
  header.bar{display:flex;align-items:center;gap:12px;padding:12px 0 18px;border-bottom:1px solid var(--char-3);margin-bottom:6px;}
  header.bar img{height:44px;width:auto;}
  header.bar h1{font-size:22px;font-weight:800;flex:1 1 auto;}
  .ghost{background:none;border:1px solid var(--char-3);border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--grey);}
  section{padding:18px 0;border-bottom:1px solid var(--char-3);}
  section:last-of-type{border-bottom:none;}
  h2{font-size:18px;font-weight:700;margin-bottom:10px;}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--char-2);border-radius:12px;padding:4px;gap:4px;}
  .seg button{border:none;background:none;border-radius:9px;padding:9px 6px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);}
  .seg button[aria-pressed="true"]{background:var(--grey);color:var(--char);}
  .pane{margin-top:12px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1px solid var(--char-3);background:var(--char-2);border-radius:20px;padding:7px 14px;font-size:14px;cursor:pointer;}
  .chip[aria-pressed="true"]{border-color:var(--yellow);color:var(--yellow);}
  .people{margin-top:10px;max-height:300px;overflow-y:auto;border:1px solid var(--char-3);border-radius:12px;}
  .people label{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--char-3);cursor:pointer;}
  .people label:last-child{border-bottom:none;}
  .people label.off{opacity:.45;cursor:not-allowed;}
  .people input{width:20px;height:20px;accent-color:var(--yellow);flex:0 0 auto;}
  .people .nm{flex:1 1 auto;min-width:0;}
  .people .sub{display:block;font-size:13px;color:var(--muted);}
  .count{margin-top:10px;font-size:14px;color:var(--muted);}
  .row2{display:grid;grid-template-columns:1fr;gap:0;}
  .link-hint{font-size:13px;color:var(--muted);margin-top:6px;word-break:break-all;}
  .link-hint.bad{color:var(--bad);}
  .chars{text-align:right;font-size:13px;color:var(--muted);margin-top:4px;}

  /* the one memorable piece: the message as it will appear on a locked phone */
  .lockscreen{margin-top:4px;border-radius:22px;padding:22px 14px 26px;
    background:radial-gradient(120% 90% at 50% 0%, #4a4a50 0%, #2b2b2f 55%, #1d1d20 100%);}
  .lockscreen .clock{text-align:center;font-family:'Archivo',sans-serif;font-weight:700;font-size:44px;line-height:1;color:#f4f3f1;}
  .lockscreen .date{text-align:center;font-size:13px;color:#d8d6d2;margin:4px 0 18px;}
  .notif{display:flex;gap:11px;background:rgba(245,244,242,.82);color:#1c1c1e;border-radius:18px;padding:11px 13px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .notif img{width:38px;height:38px;border-radius:9px;flex:0 0 auto;}
  .notif .top{display:flex;justify-content:space-between;font-size:12.5px;color:#55545a;}
  .notif .t{font-weight:600;font-size:15px;line-height:1.3;}
  .notif .b{font-size:15px;line-height:1.3;white-space:pre-wrap;word-break:break-word;}
  .notif .b.empty{color:#8a898f;}

  .result{margin-top:12px;font-size:15px;min-height:22px;}
  .result.ok{color:var(--good);} .result.no{color:var(--bad);}
  .log{list-style:none;margin:0;padding:0;}
  .log li{padding:12px 0;border-bottom:1px solid var(--char-3);}
  .log li:last-child{border-bottom:none;}
  .log .msg{white-space:pre-wrap;word-break:break-word;}
  .log .meta{font-size:13px;color:var(--muted);margin-top:3px;}
  .empty-note{color:var(--muted);font-size:14px;}
  [hidden]{display:none !important;}
  @media (prefers-reduced-motion:no-preference){ .notif{animation:drop .35s ease-out;} }
  @keyframes drop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>

<div id="lock">
  <form class="lock-card" id="lockForm" novalidate>
    <img src="/logo-rootahead.png" alt="ROOT Ahead">
    <h1>RA Messages</h1>
    <p class="muted">Send notifications to the riders who turned them on in ROOT Ahead.</p>
    <label class="field" for="pw">Admin password</label>
    <input type="password" id="pw" autocomplete="current-password">
    <button class="go" type="submit" id="unlockBtn">Unlock</button>
    <div class="err" id="lockErr" role="alert"></div>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header class="bar">
    <img src="/logo-rootahead.png" alt="ROOT Ahead">
    <h1>Messages</h1>
    <button class="ghost" type="button" id="lockBtn" title="Forget the password on this phone">Lock</button>
  </header>

  <section aria-labelledby="toTitle">
    <h2 id="toTitle">Send to</h2>
    <div class="seg" role="group" aria-label="Recipients">
      <button type="button" data-mode="all" aria-pressed="true">Everyone</button>
      <button type="button" data-mode="team" aria-pressed="false">A team</button>
      <button type="button" data-mode="people" aria-pressed="false">Choose people</button>
    </div>
    <div class="pane" id="paneTeam" hidden><div class="chips" id="teamChips"></div></div>
    <div class="pane" id="panePeople" hidden>
      <input type="search" id="peopleSearch" placeholder="Search by name or team" aria-label="Search people">
      <div class="people" id="peopleList"></div>
    </div>
    <div class="count" id="count">Loading riders…</div>
  </section>

  <section aria-labelledby="msgTitleH">
    <h2 id="msgTitleH">Message</h2>
    <label class="field" for="title">Title</label>
    <input type="text" id="title" maxlength="60" placeholder="ROOT Ahead">
    <label class="field" for="body">Text</label>
    <textarea id="body" maxlength="300" placeholder="Training moves to 9:00 tomorrow, start at the clubhouse."></textarea>
    <div class="chars" id="chars">0 / 300</div>
    <label class="field" for="link">When tapped, open</label>
    <select id="link">
      <option value="/">ROOT Ahead (dashboard)</option>
      <option value="/#track">Track (route planner)</option>
      <option value="custom">A web address…</option>
    </select>
    <input type="text" id="linkCustom" placeholder="www.example.com" inputmode="url" autocapitalize="off" spellcheck="false" hidden style="margin-top:8px;">
    <div class="link-hint" id="linkHint" hidden></div>
  </section>

  <section aria-labelledby="prevTitle">
    <h2 id="prevTitle">Preview</h2>
    <div class="lockscreen" aria-label="How it looks on a locked phone">
      <div class="clock" id="pvClock">9:41</div>
      <div class="date" id="pvDate"></div>
      <div class="notif">
        <img src="/icon-192-v2.png" alt="">
        <div style="flex:1 1 auto;min-width:0;">
          <div class="top"><span>ROOT-Ahead</span><span>now</span></div>
          <div class="t" id="pvTitle">ROOT Ahead</div>
          <div class="b empty" id="pvBody">Your message appears here.</div>
        </div>
      </div>
    </div>
    <button class="go" type="button" id="sendBtn" disabled>Send</button>
    <div class="result" id="result" role="status"></div>
  </section>

  <section aria-labelledby="sentTitle">
    <h2 id="sentTitle">Sent</h2>
    <ul class="log" id="log"><li class="empty-note">Nothing sent yet.</li></ul>
  </section>
</div>

<script>
(function(){
  'use strict';
  var KEY_STORE = 'ra-admin-key';
  var key = '';
  var users = [];            // from /api/admin-users
  var mode = 'all', team = '';
  var $ = function(id){ return document.getElementById(id); };

  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ 'x-admin-key': key }, opts.headers || {});
    return fetch(path, opts).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){ return { ok: r.ok, status: r.status, data: d }; });
    });
  }
  function name(u){ return (u.firstName || u.lastName) ? ((u.firstName || '') + ' ' + (u.lastName || '')).trim() : 'Unnamed device'; }
  function reachable(){ return users.filter(function(u){ return u.pushEnabled; }); }

  /* ---- lock / unlock (password remembered on this phone, like Blendroom) ---- */
  function showApp(){ $('lock').hidden = true; $('app').hidden = false; loadAll(); }
  function showLock(msg){ $('app').hidden = true; $('lock').hidden = false; $('lockErr').textContent = msg || ''; $('pw').value = ''; }
  $('lockForm').addEventListener('submit', function(e){
    e.preventDefault();
    key = $('pw').value.trim();
    if (!key){ $('lockErr').textContent = 'Enter the admin password.'; return; }
    $('unlockBtn').disabled = true; $('lockErr').textContent = '';
    api('/api/admin-users').then(function(res){
      $('unlockBtn').disabled = false;
      if (res.status === 401){ $('lockErr').textContent = 'That password is not correct.'; return; }
      if (!res.ok){ $('lockErr').textContent = (res.data && res.data.error) || 'The server did not answer. Try again.'; return; }
      try{ localStorage.setItem(KEY_STORE, key); }catch(x){}
      users = res.data.users || []; showApp();
    }).catch(function(){ $('unlockBtn').disabled = false; $('lockErr').textContent = 'No connection. Check your internet and try again.'; });
  });
  $('lockBtn').addEventListener('click', function(){ try{ localStorage.removeItem(KEY_STORE); }catch(x){} key = ''; showLock(); });

  /* ---- recipients ---- */
  function setMode(m){
    mode = m;
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function(b){ b.setAttribute('aria-pressed', String(b.dataset.mode === m)); });
    $('paneTeam').hidden = m !== 'team'; $('panePeople').hidden = m !== 'people';
    update();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function(b){ b.addEventListener('click', function(){ setMode(b.dataset.mode); }); });

  function renderTeams(){
    var box = $('teamChips'); box.innerHTML = '';
    var teams = [];
    reachable().forEach(function(u){ if (u.team && teams.indexOf(u.team) === -1) teams.push(u.team); });
    teams.sort();
    if (!teams.length){ box.innerHTML = '<span class="empty-note">No team has notifications turned on yet.</span>'; return; }
    if (teams.indexOf(team) === -1) team = teams[0];
    teams.forEach(function(t){
      var n = reachable().filter(function(u){ return u.team === t; }).length;
      var c = document.createElement('button'); c.type = 'button'; c.className = 'chip';
      c.textContent = t + ' (' + n + ')'; c.setAttribute('aria-pressed', String(t === team));
      c.addEventListener('click', function(){ team = t; renderTeams(); update(); });
      box.appendChild(c);
    });
  }
  function renderPeople(){
    var box = $('peopleList'), q = $('peopleSearch').value.trim().toLowerCase();
    var keep = {}; Array.prototype.forEach.call(box.querySelectorAll('input:checked'), function(c){ keep[c.value] = true; });
    box.innerHTML = '';
    var list = users.slice().sort(function(a, b){ return (b.pushEnabled - a.pushEnabled) || name(a).localeCompare(name(b)); })
      .filter(function(u){ return !q || (name(u) + ' ' + (u.team || '')).toLowerCase().indexOf(q) !== -1; });
    if (!list.length){ box.innerHTML = '<div class="empty-note" style="padding:12px 14px;">' + (users.length ? 'Nobody matches that search.' : 'No riders yet.') + '</div>'; return; }
    list.forEach(function(u){
      var l = document.createElement('label'); if (!u.pushEnabled) l.className = 'off';
      var c = document.createElement('input'); c.type = 'checkbox'; c.value = u.deviceId; c.disabled = !u.pushEnabled; c.checked = !!keep[u.deviceId];
      c.addEventListener('change', update);
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = name(u);
      var sub = document.createElement('span'); sub.className = 'sub';
      sub.textContent = (u.team || 'No team') + (u.pushEnabled ? (u.device ? ', ' + u.device : '') : ', notifications off');
      nm.appendChild(sub); l.appendChild(c); l.appendChild(nm); box.appendChild(l);
    });
  }
  $('peopleSearch').addEventListener('input', renderPeople);
  function targets(){
    if (mode === 'all') return 'all';
    if (mode === 'team') return reachable().filter(function(u){ return u.team === team; }).map(function(u){ return u.deviceId; });
    return Array.prototype.map.call($('peopleList').querySelectorAll('input:checked'), function(c){ return c.value; });
  }
  function targetCount(){ var t = targets(); return t === 'all' ? reachable().length : t.length; }

  /* ---- message + preview ---- */
  function update(){
    var title = $('title').value.trim() || 'ROOT Ahead', body = $('body').value;
    $('pvTitle').textContent = title;
    $('pvBody').textContent = body.trim() || 'Your message appears here.';
    $('pvBody').classList.toggle('empty', !body.trim());
    $('chars').textContent = body.length + ' / 300';
    var n = targetCount(), total = users.length, on = reachable().length;
    $('count').textContent = on + ' of ' + total + ' riders have notifications on' +
      (mode === 'all' ? '.' : mode === 'team' ? (team ? '. Team ' + team + ': ' + n + '.' : '.') : '. Chosen: ' + n + '.');
    $('sendBtn').textContent = n ? 'Send to ' + n + ' device' + (n === 1 ? '' : 's') : 'Send';
    $('sendBtn').disabled = !n || !body.trim() || !linkValue();
    updateLinkHint();
  }
  ['title', 'body', 'linkCustom'].forEach(function(id){ $(id).addEventListener('input', update); });
  $('link').addEventListener('change', function(){ $('linkCustom').hidden = this.value !== 'custom'; update(); });
  // Accepts "www.winsol.eu", "winsol.eu/page" or a full https:// address
  function linkValue(){
    if ($('link').value !== 'custom') return $('link').value;
    var v = $('linkCustom').value.trim();
    if (/^http:\/\//i.test(v)) v = 'https://' + v.slice(7);          // phones block plain http
    else if (!/^https:\/\//i.test(v)) v = 'https://' + v;
    return /^https:\/\/[^\s\/]+\.[a-z]{2,}(\/\S*)?$/i.test(v) ? v : '';
  }
  function updateLinkHint(){
    var h = $('linkHint'), custom = $('link').value === 'custom', raw = $('linkCustom').value.trim(), v = linkValue();
    h.hidden = !custom;
    if (!custom) return;
    h.className = 'link-hint' + (raw && !v ? ' bad' : '');
    h.textContent = !raw ? 'Type an address, for example www.winsol.eu' : v ? 'Opens ' + v : 'That doesn\u2019t look like a web address.';
  }
  (function clock(){
    var d = new Date();
    $('pvClock').textContent = d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }).replace(/\s?[AP]M$/i, '');
    $('pvDate').textContent = d.toLocaleDateString([], { weekday:'long', day:'numeric', month:'long' });
    setTimeout(clock, 30000);
  })();

  /* ---- send ---- */
  $('sendBtn').addEventListener('click', function(){
    var t = targets(), n = targetCount(), btn = this;
    if (!confirm('Send this message to ' + n + ' device' + (n === 1 ? '' : 's') + '?')) return;
    btn.disabled = true; $('result').className = 'result'; $('result').textContent = 'Sending…';
    api('/api/admin-message', { method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ deviceIds: t, title: $('title').value.trim(), body: $('body').value.trim(), url: linkValue() }) })
      .then(function(res){
        if (res.status === 401){ try{ localStorage.removeItem(KEY_STORE); }catch(x){} showLock('The admin password changed. Unlock again.'); return; }
        if (!res.ok){ $('result').className = 'result no'; $('result').textContent = (res.data && res.data.error) || 'Sending failed. Try again.'; update(); return; }
        var d = res.data;
        $('result').className = 'result ' + (d.sent ? 'ok' : 'no');
        $('result').textContent = 'Delivered to ' + d.sent + ' of ' + (d.sent + d.failed + d.skipped) + '.' +
          (d.removed ? ' ' + d.removed + ' device' + (d.removed === 1 ? ' had' : 's had') + ' removed the app and ' + (d.removed === 1 ? 'was' : 'were') + ' taken off the list.' : '');
        if (d.sent) $('body').value = '';
        loadAll();
      }).catch(function(){ $('result').className = 'result no'; $('result').textContent = 'No connection. The message was not sent.'; update(); });
  });

  /* ---- data ---- */
  function renderLog(msgs){
    var ul = $('log'); ul.innerHTML = '';
    if (!msgs.length){ ul.innerHTML = '<li class="empty-note">Nothing sent yet.</li>'; return; }
    var names = {}; users.forEach(function(u){ names[u.deviceId] = name(u); });
    msgs.forEach(function(m){
      var li = document.createElement('li');
      var msg = document.createElement('div'); msg.className = 'msg';
      msg.textContent = (m.title && m.title !== 'ROOT Ahead' ? m.title + '\n' : '') + m.body;
      var meta = document.createElement('div'); meta.className = 'meta';
      var who = m.everyone ? 'everyone' : (m.to || []).map(function(id){ return names[id] || 'a removed device'; }).slice(0, 5).join(', ') + ((m.to || []).length > 5 ? ' and ' + ((m.to || []).length - 5) + ' more' : '');
      meta.textContent = new Date(m.at).toLocaleString([], { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) +
        ', to ' + who + ', delivered ' + m.sent + ' of ' + (m.to || []).length;
      li.appendChild(msg); li.appendChild(meta); ul.appendChild(li);
    });
  }
  function loadAll(){
    api('/api/admin-users').then(function(res){
      if (res.status === 401){ try{ localStorage.removeItem(KEY_STORE); }catch(x){} showLock('Unlock again.'); return; }
      if (!res.ok){ $('count').textContent = (res.data && res.data.error) || 'Could not load riders.'; return; }
      users = res.data.users || [];
      renderTeams(); renderPeople(); update();
      return api('/api/admin-message').then(function(r2){ if (r2.ok) renderLog(r2.data.messages || []); });
    }).catch(function(){ $('count').textContent = 'No connection. Pull down or reopen to try again.'; });
  }

  // start: unlocked if this phone remembers the password
  try{ key = localStorage.getItem(KEY_STORE) || ''; }catch(x){}
  if (key) showApp(); else showLock();
  update();
})();
</script>
</body>
</html>
